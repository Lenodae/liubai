[tool.ruff]
line-length = 100
exclude = [".venv"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"manage.py" = ["E402"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
exclude = [".venv", "tasks/tests", "tools", "migrations"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.coverage.run]
source = ["tasks"]
branch = true
omit = ["tasks/tests/*", "tasks/migrations/*"]

[tool.coverage.report]
show_missing = true
